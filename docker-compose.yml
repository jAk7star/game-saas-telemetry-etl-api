version: "3.9"

services:
  telemetry-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-saas-telemetry-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/telemetry_warehouse.db
      - ZERO_EXPOSURE_SALT=${ZERO_EXPOSURE_SALT:-antigravity-lgpd-zero-exposure-salt-2026}
      - ENVIRONMENT=production
    volumes:
      - telemetry_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  telemetry_data:
